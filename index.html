<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <title>BizPilot AI</title>
  <style>
    :root{color-scheme:dark;--bg:#10131a;--panel:#181c24;--panel-2:#202530;--line:#2b303a;--text:#e8eaf0;--muted:#969eae;--accent:#74a7ff;--accent-strong:#3275ef;--user:#26354b;--danger:#f17b85;--shadow:0 16px 48px #0004;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;height:100dvh;background:var(--bg);color:var(--text)}button,textarea,input,select{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.55;cursor:wait}.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:278px;flex:0 0 278px;display:flex;flex-direction:column;background:#15181f;border-right:1px solid var(--line);padding:14px 12px;transition:transform .2s,width .2s,flex-basis .2s;z-index:5}.brand{height:48px;display:flex;align-items:center;gap:11px;padding:0 9px;font-size:16px;font-weight:700;letter-spacing:-.03em}.brand-mark{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;color:#fff;background:linear-gradient(145deg,#3477f6,#6cb8ff);font-size:16px}.brand small{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:0}.side-action,.history-row,.icon-button,.settings-button,.theme-button{border:0;background:transparent}.side-action{height:42px;margin:10px 2px 14px;padding:0 12px;text-align:left;border:1px solid #353b47;border-radius:10px;background:#1c2028;font-weight:600}.side-action:hover,.history-row:hover,.icon-button:hover,.settings-button:hover,.theme-button:hover{background:var(--panel-2)}.section-label{padding:12px 9px 7px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.history{overflow:auto;flex:1;min-height:0}.history-empty{padding:8px 9px;color:var(--muted);font-size:13px;line-height:1.5}.history-row{display:flex;align-items:center;gap:4px;margin:2px 0;border-radius:9px}.history-open{min-width:0;flex:1;padding:10px 9px;border:0;background:transparent;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.history-open.active{color:var(--accent)}.history-tools{display:flex}.history-tools button{width:28px;height:30px;border:0;border-radius:7px;background:transparent;color:var(--muted)}.side-bottom{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line)}.profile-chip{min-width:0;flex:1;display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:9px;text-align:left;background:transparent;border:0}.avatar{width:31px;height:31px;display:grid;place-items:center;border-radius:50%;background:#35435a;color:#dfeaff;font-weight:700}.profile-copy{min-width:0;display:flex;flex-direction:column}.profile-copy strong{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile-copy small{font-size:11px;color:var(--muted)}.theme-button{width:36px;height:36px;border-radius:9px}.workspace{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:12px;padding:0 18px}.topbar-title{font-weight:600;font-size:14px}.topbar-spacer{flex:1}.icon-button{width:38px;height:38px;border-radius:9px;font-size:18px}.mobile-menu{display:none}.messages{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth;padding:20px 20px 28px}.message-list{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:26px}.empty-state{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 14px 80px;text-align:center}.empty-mark{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:#202b3a;color:var(--accent);font-size:25px}.empty-state h1{margin:20px 0 8px;font-size:clamp(25px,4vw,36px);letter-spacing:-.045em}.empty-state p{margin:0;color:var(--muted);font-size:14px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(650px,100%);margin-top:28px}.suggestion{padding:13px 15px;border:1px solid var(--line);border-radius:12px;text-align:left;background:#171b23;color:#dce3ee;font-size:13px;line-height:1.4}.suggestion:hover{border-color:#5577aa;background:#1d2430}.message{width:100%;display:flex;gap:13px;align-items:flex-start}.message.user{justify-content:flex-end}.message-avatar{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:50%;background:#28364b;color:#c7dcff;font-size:12px;font-weight:700}.message.assistant .message-avatar{background:linear-gradient(145deg,#3477f6,#6cb8ff);color:white}.message-content{min-width:0;max-width:min(760px,calc(100% - 44px));line-height:1.68;font-size:15px}.user .message-content{max-width:min(620px,85%);padding:11px 16px;border-radius:18px 18px 5px 18px;background:var(--user);white-space:pre-wrap;overflow-wrap:anywhere}.assistant .message-content{flex:1;padding-top:2px;overflow-wrap:anywhere}.markdown h1,.markdown h2,.markdown h3{line-height:1.3;margin:1.05em 0 .5em;letter-spacing:-.02em}.markdown h1{font-size:1.45em}.markdown h2{font-size:1.25em}.markdown h3{font-size:1.1em}.markdown p{margin:.45em 0 .8em}.markdown ul,.markdown ol{padding-left:1.5em;margin:.5em 0 .9em}.markdown li{padding-left:.2em;margin:.2em 0}.markdown strong{font-weight:700;color:var(--text)}.markdown code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#252b36;border-radius:5px;padding:.12em .38em;font-size:.9em}.markdown pre{overflow:auto;padding:14px;border-radius:11px;border:1px solid var(--line);background:#0b0d12;line-height:1.5}.markdown pre code{padding:0;background:transparent}.table-wrap{overflow:auto;margin:12px 0}.markdown table{border-collapse:collapse;width:100%;font-size:13px}.markdown th,.markdown td{padding:8px 10px;border:1px solid var(--line);text-align:left}.markdown th{background:var(--panel-2)}.message-actions{display:flex;align-items:center;gap:6px;margin-top:8px}.message-actions button{padding:5px 8px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:12px}.message-actions button:hover{background:var(--panel-2);color:var(--text)}.message-status{font-size:12px;color:var(--muted)}.message-error{padding:11px 13px;border-radius:10px;background:#382027;color:#ffc2c7}.retry-button{margin:9px 0 0;padding:6px 10px;border:1px solid #8c4551;border-radius:7px;background:#4a2830;color:#ffdadd}.typing{display:flex;gap:5px;align-items:center;color:var(--muted);height:20px}.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite alternate}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes pulse{to{opacity:.25;transform:translateY(-3px)}}.composer-area{flex:0 0 auto;padding:10px 18px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 18%)}.composer-wrap{max-width:820px;margin:0 auto}.composer{display:flex;align-items:flex-end;gap:9px;padding:10px;border:1px solid #3a414d;border-radius:19px;background:#1b1e25;box-shadow:0 8px 30px #0003}.composer:focus-within{border-color:#638aca}.composer textarea{flex:1;min-width:0;max-height:190px;resize:none;border:0;outline:0;background:transparent;color:var(--text);line-height:1.5;padding:7px 6px}.composer textarea::placeholder{color:#8f97a6}.send-button,.stop-button{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:12px;background:var(--accent-strong);font-size:16px}.stop-button{background:#3a414d}.composer-hint{text-align:center;margin:8px 0 0;color:var(--muted);font-size:11px}.overlay{display:none}.modal{width:min(480px,calc(100% - 28px));padding:0;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);box-shadow:var(--shadow)}.modal::backdrop{background:#0009;backdrop-filter:blur(3px)}.modal-header{display:flex;align-items:center;padding:20px 22px 12px}.modal-header h2{margin:0;font-size:19px}.modal-header button{margin-left:auto}.settings-form{padding:5px 22px 22px}.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field label{font-size:13px;color:#cbd1db}.field input,.field select{height:42px;padding:0 11px;border:1px solid #414957;border-radius:9px;background:var(--bg);color:var(--text)}.modal-actions{display:flex;gap:9px;margin-top:20px}.modal-actions button{padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2)}.modal-actions .save-settings{background:var(--accent-strong);border-color:transparent}.settings-status{min-height:20px;color:#9ce7cb;font-size:12px}.light{color-scheme:light;--bg:#f7f8fa;--panel:#fff;--panel-2:#eef1f5;--line:#dfe3e9;--text:#242832;--muted:#737c8b;--accent:#2465c7;--accent-strong:#2768d6;--user:#e5edf8}.light .sidebar{background:#fff}.light .side-action,.light .composer{background:#fff}.light .suggestion{background:#fff;color:#29303b}.light .suggestion:hover{background:#f2f6fc}.light .composer{box-shadow:0 8px 30px #13243b12}.light .markdown code{background:#eceff4}.light .markdown pre{background:#f0f2f5}.light .message-actions button:hover{background:#eff1f5}.light .profile-button,.light .history-row{color:var(--text)}
    @media(max-width:700px){.sidebar{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);transform:translateX(-102%);box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.overlay.visible{display:block;position:fixed;inset:0;background:#0008;z-index:4}.mobile-menu{display:inline-grid;place-items:center}.topbar{padding:0 10px}.messages{padding:12px 12px 20px}.composer-area{padding-left:10px;padding-right:10px}.message{gap:9px}.message-content{font-size:14px;max-width:calc(100% - 39px)}.message-avatar{width:28px;height:28px;flex-basis:28px}.user .message-content{max-width:86%}.suggestions{grid-template-columns:1fr}.empty-state{padding-bottom:30px}.composer-hint{font-size:10px}.history-row .history-tools button{width:26px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Conversation history">
      <div class="brand"><span class="brand-mark">B</span><span>BizPilot AI</span></div>
      <button class="side-action" id="new-chat">＋ &nbsp; New chat</button>
      <div class="section-label">Recent chats</div>
      <div class="history" id="history-list"></div>
      <div class="side-bottom">
        <button class="profile-chip" id="open-settings"><span class="avatar" id="avatar">G</span><span class="profile-copy"><strong id="profile-name">Guest</strong><small id="profile-summary">Set your preferences</small></span></button>
        <button class="theme-button" id="theme-toggle" aria-label="Toggle light and dark mode" title="Toggle theme">☼</button>
      </div>
    </aside>
    <div class="overlay" id="sidebar-overlay"></div>
    <main class="workspace">
      <header class="topbar"><button class="icon-button mobile-menu" id="menu-toggle" aria-label="Open conversation history">☰</button><span class="topbar-title" id="conversation-title">New chat</span><span class="topbar-spacer"></span><button class="icon-button" id="top-settings" aria-label="Open settings" title="Settings">⚙</button></header>
      <section class="messages" id="messages-scroll" aria-live="polite"><div class="message-list" id="message-list"></div></section>
      <footer class="composer-area"><div class="composer-wrap"><form class="composer" id="chat-form"><textarea id="chat-input" rows="1" maxlength="20000" placeholder="Message BizPilot AI" aria-label="Message BizPilot AI"></textarea><button type="button" class="stop-button" id="stop-button" hidden aria-label="Stop generating" title="Stop">■</button><button class="send-button" id="send-button" aria-label="Send message" title="Send">↑</button></form><p class="composer-hint">BizPilot AI can make mistakes. Verify important decisions. Enter to send · Shift+Enter for a new line</p></div></footer>
    </main>
  </div>
  <dialog class="modal" id="settings-modal" aria-labelledby="settings-title"><div class="modal-header"><h2 id="settings-title">Guest preferences</h2><button class="icon-button" id="close-settings" aria-label="Close settings">×</button></div><form class="settings-form" id="settings-form"><div class="field"><label for="display-name">Display name</label><input id="display-name" maxlength="60" autocomplete="name" placeholder="Guest"></div><div class="field"><label for="location">Preferred location</label><input id="location" maxlength="200" placeholder="e.g. Kuppam, Andhra Pradesh"></div><div class="field"><label for="currency">Preferred currency</label><select id="currency"><option value="INR">INR (₹)</option><option value="USD">USD ($)</option><option value="EUR">EUR (€)</option><option value="GBP">GBP (£)</option><option value="CAD">CAD ($)</option><option value="AUD">AUD ($)</option></select></div><div class="field"><label for="language">Preferred language</label><select id="language"><option value="en">English</option><option value="hi">Hindi</option><option value="te">Telugu</option><option value="ta">Tamil</option><option value="kn">Kannada</option><option value="ml">Malayalam</option><option value="bn">Bengali</option><option value="es">Spanish</option><option value="fr">French</option></select></div><div class="settings-status" id="settings-status" aria-live="polite"></div><div class="modal-actions"><button class="save-settings" type="submit">Save preferences</button><button type="button" id="clear-settings">Clear</button></div></form></dialog>
  <script>
    const API_BASE = '';
    const HISTORY_KEY = 'bizpilot-chat-history-v1';
    const PREFS_KEY = 'bizpilot-guest-preferences-v1';
    const THEME_KEY = 'bizpilot-theme-v1';
    const IMPORT_KEY = 'bizpilot-saved-work-chat-import-v1';
    const $ = id => document.getElementById(id);
    const messageList = $('message-list'), messageScroll = $('messages-scroll'), input = $('chat-input');
    let conversation = null, abortController = null, requestPending = false, retryQuestion = '';

    function safeText(value){const d=document.createElement('div');d.textContent=String(value??'');return d.innerHTML}
    function prefs(){try{const p=JSON.parse(localStorage.getItem(PREFS_KEY)||'{}');return{displayName:typeof p.displayName==='string'?p.displayName:'',location:typeof p.location==='string'?p.location:'',currency:typeof p.currency==='string'?p.currency:'INR',language:typeof p.language==='string'?p.language:'en'}}catch{return{displayName:'',location:'',currency:'INR',language:'en'}}}
    function isSensitive(text){return /(?:api[_ -]?key|password|passwd|secret|access[_ -]?token|bearer)\s*(?:[:=]|is)\s*\S+/i.test(text)||/(?:sk-[A-Za-z0-9_-]{12,}|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[A-Z0-9]{16})/.test(text)}
    function readHistory(){try{const items=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');if(!Array.isArray(items))return[];return items.filter(c=>c&&typeof c.id==='string'&&Array.isArray(c.messages)).map(c=>({...c,title:c.title||'Conversation',messages:c.messages.map(m=>({role:m.role||(m.sender==='You'?'user':'assistant'),content:m.content??m.text??'',error:m.error||''})).filter(m=>m.content||m.error)}))}catch{return[]}}
    function persist(){if(!conversation)return;if(conversation.messages.some(m=>isSensitive(m.content||''))){$('history-list').dataset.notice='This chat contains text that looks like a secret and was not saved.';renderHistory();return}try{conversation.updatedAt=new Date().toISOString();const h=readHistory(),i=h.findIndex(c=>c.id===conversation.id);if(i<0)h.unshift(conversation);else h[i]=conversation;localStorage.setItem(HISTORY_KEY,JSON.stringify(h));renderHistory()}catch{$('history-list').dataset.notice='Browser storage is unavailable; this chat will not persist.';renderHistory()}}
    function id(){return crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`}
    function renderHistory(){const el=$('history-list'),items=readHistory().sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));el.innerHTML=items.length?items.map(c=>`<div class="history-row"><button class="history-open ${conversation?.id===c.id?'active':''}" data-open="${safeText(c.id)}" title="${safeText(c.title)}">${safeText(c.title)}</button><span class="history-tools"><button data-rename="${safeText(c.id)}" title="Rename chat" aria-label="Rename chat">✎</button><button data-delete="${safeText(c.id)}" title="Delete chat" aria-label="Delete chat">×</button></span></div>`).join(''):`<div class="history-empty">${safeText(el.dataset.notice||'Your conversations will appear here.')}</div>`}
    function inlineMarkdown(text){let s=safeText(text);s=s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');return s}
    function markdown(source){const lines=String(source||'').replace(/\r/g,'').split('\n');let out='',i=0;while(i<lines.length){let line=lines[i];if(line.trim().startsWith('```')){const lang=line.trim().slice(3);i++;let code=[];while(i<lines.length&&!lines[i].trim().startsWith('```'))code.push(lines[i++]);i++;out+=`<pre><code${lang?` class="language-${safeText(lang)}"`:''}>${safeText(code.join('\n'))}</code></pre>`;continue}if(!line.trim()){i++;continue}if(/^\|.*\|$/.test(line.trim())&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){const cells=row=>row.trim().replace(/^\||\|$/g,'').split('|').map(v=>v.trim());const head=cells(line);i+=2;let rows=[];while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i]))rows.push(cells(lines[i++]));out+='<div class="table-wrap"><table><thead><tr>'+head.map(c=>`<th>${inlineMarkdown(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+head.map((_,n)=>`<td>${inlineMarkdown(r[n]||'')}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';continue}const hm=line.match(/^(#{1,3})\s+(.+)$/);if(hm){const n=hm[1].length;out+=`<h${n}>${inlineMarkdown(hm[2])}</h${n}>`;i++;continue}if(/^\s*[-*+]\s+/.test(line)){let items=[];while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i]))items.push(`<li>${inlineMarkdown(lines[i++].replace(/^\s*[-*+]\s+/,''))}</li>`);out+=`<ul>${items.join('')}</ul>`;continue}if(/^\s*\d+[.)]\s+/.test(line)){let items=[];while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i]))items.push(`<li>${inlineMarkdown(lines[i++].replace(/^\s*\d+[.)]\s+/,''))}</li>`);out+=`<ol>${items.join('')}</ol>`;continue}let para=[line.trim()];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,3})\s|^\s*[-*+]\s+|^\s*\d+[.)]\s+|^```/.test(lines[i])&&!(/^\|.*\|$/.test(lines[i].trim())&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])))para.push(lines[i++].trim());out+=`<p>${para.map(inlineMarkdown).join('<br>')}</p>`}return out}
    function scrollBottom(){messageScroll.scrollTop=messageScroll.scrollHeight}
    function assistantEmpty(){return conversation?.messages.length===0}
    const suggestions=['Business ideas under ₹1 lakh in Kuppam','Create a business plan for a tea shop','Analyze competitors for a mobile repair shop','Estimate startup costs for a home bakery'];
    function render(){messageList.innerHTML='';if(!conversation||!conversation.messages.length){$('conversation-title').textContent='New chat';const empty=document.createElement('div');empty.className='empty-state';empty.innerHTML=`<div class="empty-mark">✦</div><h1>What are you building today?</h1><p>Ask BizPilot AI about business ideas, planning, costs, customers, or your local market.</p><div class="suggestions">${suggestions.map(s=>`<button class="suggestion" data-suggestion="${safeText(s)}">${safeText(s)}</button>`).join('')}</div>`;messageList.append(empty);renderHistory();return}
      $('conversation-title').textContent=conversation.title||'Conversation';conversation.messages.forEach((m,index)=>{const row=document.createElement('article');row.className=`message ${m.role==='user'?'user':'assistant'}`;if(m.role==='assistant'){const av=document.createElement('div');av.className='message-avatar';av.textContent='B';row.append(av)}const content=document.createElement('div');content.className='message-content';if(m.error){content.innerHTML=`<div class="message-error">${safeText(m.error)}</div><button class="retry-button" data-retry="${index}">Retry</button>`}else if(m.role==='user'){content.textContent=m.content}else{const body=document.createElement('div');body.className='markdown';body.innerHTML=markdown(m.content);content.append(body);const actions=document.createElement('div');actions.className='message-actions';const copy=document.createElement('button');copy.textContent='Copy';copy.dataset.copy=String(index);const save=document.createElement('button');save.textContent='Save idea';save.dataset.save=String(index);const status=document.createElement('span');status.className='message-status';status.textContent=m.saveStatus||'';actions.append(copy,save,status);content.append(actions)}row.append(content);if(m.role==='user'){const av=document.createElement('div');av.className='message-avatar';av.textContent=(prefs().displayName||'G').trim().slice(0,1).toUpperCase();row.append(av)}messageList.append(row)});if(requestPending){const t=document.createElement('div');t.className='message assistant';t.innerHTML='<div class="message-avatar">B</div><div class="message-content"><div class="typing" aria-label="BizPilot AI is typing"><i></i><i></i><i></i></div></div>';messageList.append(t)}renderHistory();scrollBottom()}
    function newChat(){if(abortController)abortController.abort();conversation=null;retryQuestion='';input.value='';render();input.focus();closeSidebar()}
    function openChat(chat){if(abortController)abortController.abort();conversation=chat;render();closeSidebar()}
    function closeSidebar(){$('sidebar').classList.remove('open');$('sidebar-overlay').classList.remove('visible')}
    async function consumeStream(response,onEvent){if(!response.ok){if(response.status===422){const body=await response.json().catch(()=>null);const details=Array.isArray(body?.detail)?body.detail.map(item=>`${(item.loc||[]).filter(part=>part!=='body').join('.')}: ${item.msg}`).join('; '):'';throw new Error(`The chat request did not match the server format${details?` (${details})`:''}. Please start a new chat or retry.`)}throw new Error(response.status===429?'The AI provider is rate limiting requests. Wait a moment, then retry.':`The chat service returned an error (${response.status}).`)}if(!response.body)throw new Error('Streaming is unavailable in this browser.');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const{value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let cut;while((cut=buffer.indexOf('\n\n'))>=0){const frame=buffer.slice(0,cut);buffer=buffer.slice(cut+2);const data=frame.split('\n').filter(l=>l.startsWith('data:')).map(l=>l.slice(5).trim()).join('\n');if(data)onEvent(JSON.parse(data))}}if(buffer.trim()){const data=buffer.split('\n').find(l=>l.startsWith('data:'))?.slice(5).trim();if(data)onEvent(JSON.parse(data))}}
    async function sendQuestion(question,alreadyAdded=false){const q=question.trim();if(!q||requestPending)return;if(!conversation)conversation={id:id(),title:q.slice(0,70),messages:[],createdAt:new Date().toISOString()};if(!alreadyAdded)conversation.messages.push({role:'user',content:q});if(conversation.messages.length===1)conversation.title=q.split('\n')[0].slice(0,70);retryQuestion=q;const answer={role:'assistant',content:'',error:''};conversation.messages.push(answer);input.value='';requestPending=true;abortController=new AbortController();$('send-button').hidden=true;$('stop-button').hidden=false;render();persist();const p=prefs();const history=conversation.messages.slice(0,-1).filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role,content:m.content}));try{const response=await fetch(`${API_BASE}/chat`,{method:'POST',headers:{'Content-Type':'application/json'},signal:abortController.signal,body:JSON.stringify({messages:history,location:p.location,currency:p.currency,language:p.language})});await consumeStream(response,event=>{if(event.type==='delta'){answer.content+=event.text;render()}else if(event.type==='error'){throw new Error(event.message||'The AI service could not complete this reply.')}else if(event.type==='done'){answer.error=''}});if(!answer.content.trim()&&!answer.error)answer.error='The AI returned an empty response. Please retry.';persist()}catch(error){if(error.name==='AbortError'){if(answer.content)persist();else conversation.messages=conversation.messages.filter(m=>m!==answer)}else{answer.error=error.message||'Network error. Check your connection and retry.';persist()}}finally{requestPending=false;abortController=null;$('send-button').hidden=false;$('stop-button').hidden=true;render()}}
    $('chat-form').addEventListener('submit',e=>{e.preventDefault();sendQuestion(input.value)});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendQuestion(input.value)}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,190)+'px'});
    $('stop-button').addEventListener('click',()=>abortController?.abort());$('new-chat').addEventListener('click',newChat);
    messageList.addEventListener('click',async e=>{const suggestion=e.target.closest('[data-suggestion]');if(suggestion){sendQuestion(suggestion.dataset.suggestion);return}const retry=e.target.closest('[data-retry]');if(retry){const index=Number(retry.dataset.retry);if(conversation.messages[index]?.error){const user=conversation.messages.slice(0,index).reverse().find(m=>m.role==='user');conversation.messages=conversation.messages.slice(0,index);if(user)sendQuestion(user.content,true)}return}const copy=e.target.closest('[data-copy]');if(copy){const m=conversation.messages[Number(copy.dataset.copy)];try{await navigator.clipboard.writeText(m.content);copy.textContent='Copied';setTimeout(()=>copy.textContent='Copy',1300)}catch{copy.textContent='Copy unavailable'}return}const save=e.target.closest('[data-save]');if(save){const m=conversation.messages[Number(save.dataset.save)];if(!m?.content)return;const title=(m.content.match(/^#{1,3}\s+(.+)$/m)?.[1]||m.content.split('\n')[0]).replace(/[*#`]/g,'').slice(0,200)||'BizPilot AI idea';const status=save.parentElement.querySelector('.message-status');status.textContent='Saving…';try{const r=await fetch(`${API_BASE}/ideas`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,description:m.content})});if(!r.ok)throw new Error();m.saveStatus='Saved';status.textContent='Saved';persist()}catch{m.saveStatus='Could not save';status.textContent='Could not save. Retry.'}}});
    $('history-list').addEventListener('click',e=>{const open=e.target.closest('[data-open]'),rename=e.target.closest('[data-rename]'),del=e.target.closest('[data-delete]');if(open){const c=readHistory().find(x=>x.id===open.dataset.open);if(c)openChat(c)}else if(rename){const c=readHistory().find(x=>x.id===rename.dataset.rename);if(c){const value=prompt('Rename this chat',c.title);if(value?.trim()){c.title=value.trim().slice(0,70);const h=readHistory();localStorage.setItem(HISTORY_KEY,JSON.stringify(h.map(x=>x.id===c.id?c:x)));render()}}}else if(del){const h=readHistory().filter(x=>x.id!==del.dataset.delete);localStorage.setItem(HISTORY_KEY,JSON.stringify(h));if(conversation?.id===del.dataset.delete)newChat();else renderHistory()}});
    function showSettings(){const p=prefs();$('display-name').value=p.displayName;$('location').value=p.location;$('currency').value=p.currency;$('language').value=p.language;$('settings-status').textContent='';$('settings-modal').showModal()}
    $('open-settings').addEventListener('click',showSettings);$('top-settings').addEventListener('click',showSettings);$('close-settings').addEventListener('click',()=>$('settings-modal').close());$('settings-form').addEventListener('submit',e=>{e.preventDefault();const p={displayName:$('display-name').value.trim().slice(0,60),location:$('location').value.trim().slice(0,200),currency:$('currency').value,language:$('language').value};try{localStorage.setItem(PREFS_KEY,JSON.stringify(p));updateProfile();$('settings-status').textContent='Preferences saved in this browser.'}catch{$('settings-status').textContent='Could not save preferences in browser storage.'}});$('clear-settings').addEventListener('click',()=>{localStorage.removeItem(PREFS_KEY);$('settings-form').reset();$('currency').value='INR';$('language').value='en';updateProfile();$('settings-status').textContent='Preferences cleared.'});
    function updateProfile(){const p=prefs();$('profile-name').textContent=p.displayName||'Guest';$('avatar').textContent=(p.displayName||'G').trim().slice(0,1).toUpperCase();$('profile-summary').textContent=[p.location,p.currency,p.language.toUpperCase()].filter(Boolean).join(' · ')||'Set your preferences'}
    $('theme-toggle').addEventListener('click',()=>{document.body.classList.toggle('light');localStorage.setItem(THEME_KEY,document.body.classList.contains('light')?'light':'dark')});if(localStorage.getItem(THEME_KEY)==='light')document.body.classList.add('light');
    $('menu-toggle').addEventListener('click',()=>{$('sidebar').classList.add('open');$('sidebar-overlay').classList.add('visible')});$('sidebar-overlay').addEventListener('click',closeSidebar);
    async function importSavedWork(){if(localStorage.getItem(IMPORT_KEY))return;try{const [ideasResponse,plansResponse]=await Promise.all([fetch(`${API_BASE}/ideas`),fetch(`${API_BASE}/plans`)]);if(!ideasResponse.ok||!plansResponse.ok)return;const[ideas,plans]=await Promise.all([ideasResponse.json(),plansResponse.json()]);const parts=[];if(Array.isArray(ideas)&&ideas.length){parts.push('## Saved business ideas\n'+ideas.map(i=>`### ${i.title}\n${i.description}`).join('\n\n'))}if(Array.isArray(plans)&&plans.length){parts.push('## Saved business plans\n'+plans.map(p=>`### ${p.idea}\n**Location:** ${p.location} · **Budget:** ${Number(p.budget).toLocaleString()} ${p.currency}\n\n#### Target customers\n${(p.target_customers||[]).map(v=>'- '+v).join('\n')}\n\n#### Startup costs\n${(p.startup_costs||[]).map(v=>'- '+v).join('\n')}\n\n#### Operating costs\n${(p.operating_costs||[]).map(v=>'- '+v).join('\n')}\n\n#### Risks\n${(p.risks||[]).map(v=>'- '+v).join('\n')}\n\n#### Launch steps\n${(p.launch_steps||[]).map((v,n)=>`${n+1}. ${v}`).join('\n')}\n\n**Assumptions:** ${(p.estimates_and_assumptions||[]).join('; ')}\n\n_${p.disclaimer||''}_`).join('\n\n---\n\n'))}if(parts.length){const imported={id:id(),title:'Saved work · ideas & plans',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),messages:[{role:'user',content:'Show me my existing saved ideas and business plans.'},{role:'assistant',content:'Your existing saved work has been brought into chat for reference. It remains stored in the original BizPilot database too.\n\n'+parts.join('\n\n---\n\n')}]};const h=readHistory();h.unshift(imported);localStorage.setItem(HISTORY_KEY,JSON.stringify(h))}localStorage.setItem(IMPORT_KEY,'complete');renderHistory()}catch{}}
    updateProfile();render();importSavedWork();
  </script>
